name: Keep API warm

# Render's free plan spins the API down after ~15 min idle (then a ~30–60s cold
# start on the next request). This pings the public health endpoint on a schedule
# so the idle timer never elapses. Free on this public repo (Actions minutes are
# unmetered for public repos).
#
# NB: GitHub `schedule` is best-effort and can be delayed a few minutes under
# load, so we ping every 10 min to keep margin under Render's 15-min window. The
# minutes are offset off the round marks (…:04, :14, …) on purpose — jobs cron'd
# at :00/:05/:10 contend with everyone else's and get delayed most. For rock-solid
# timing + downtime alerts, additionally point a free external pinger (UptimeRobot
# / cron-job.org, 5-min interval) at the same URL.

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

# A slow wake-up shouldn't let runs pile up.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          # If it had spun down, the first hit triggers the wake (can take ~30–60s),
          # so allow a generous timeout and retry a couple of times.
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
              https://api.ica2.xyz/api/health || echo "000")
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "health check never returned 200"
          exit 1
