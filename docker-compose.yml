services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for menu media (dev). Mirrors Cloudflare R2 in
  # prod via one code path (api storage/S3Service). Console at :9001.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create the media bucket and allow anonymous downloads so
  # MEDIA_PUBLIC_BASE_URL serves objects directly (matches an R2 public bucket).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/menu-media &&
      mc anonymous set download local/menu-media
      "

  # Dev SMTP sink: catches all outgoing mail (invitations, magic links, OTP
  # codes) — nothing is delivered. View + click links in the web inbox at
  # http://localhost:8025. Use with EMAIL_TRANSPORT=smtp, SMTP_HOST=localhost,
  # SMTP_PORT=1025 (no auth). The default EMAIL_TRANSPORT=console needs none of
  # this — it just logs to the API stdout.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
