packages:
  - apps/*
  - packages/*

peerDependencyRules:
  allowedVersions:
    "@swc/cli>chokidar": "4"

allowBuilds:
  "@nestjs/core": true
  "@prisma/engines": true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true

catalog:
  typescript: ^6.0.3
  next: ^16.2.6
  "@next/eslint-plugin-next": ^16.2.6
  react: ^19.2.6
  react-dom: ^19.2.6
  "@types/node": ^25.9.1
  "@types/react": ^19.2.15
  "@types/react-dom": ^19.2.3
  eslint: ^9.39.4
  "@eslint/js": ^9.39.4
  tailwindcss: ^4.3.0
  "@tailwindcss/postcss": ^4.3.0
  lucide-react: ^1.17.0
  next-themes: ^0.4.6
  dotenv: ^17.4.2
