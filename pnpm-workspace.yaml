  react: 19.2.4
  react-dom: 19.2.4
  typescript: ^5.9.3
  "@types/node": ^20.19.43
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  eslint: ^9.39.4
  "@eslint/js": ^9.39.4
  tailwindcss: ^4.3.1
  "@tailwindcss/postcss": ^4.3.1
  lucide-react: ^1.21.0
  next-themes: ^0.4.6
  dotenv: ^17.4.2
  zod: ^4.4.3
  "@t3-oss/env-nextjs": ^0.13.11
  sonner: ^2.0.7
  "@tanstack/react-query": ^5.101.0
